<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CAK3D_Creations — build</title>
<meta name="description" content="A CAK3D_Creations build — full rundown, features and downloads." />
<meta name="theme-color" content="#070c08" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#070b09; --panel:#0e140d; --panel2:#0b110a; --ink:#e7f0e2; --muted:#8fa189;
    --line:rgba(140,170,120,.16);
    /* per-app theme — set from the catalog by JS; these are only fallbacks */
    --a:#5fd36a; --b:#f0b429;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --disp:'Space Grotesk',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--disp);-webkit-font-smoothing:antialiased;
    overflow-x:hidden;line-height:1.6}
  a{color:inherit;text-decoration:none}
  canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.85}
  .wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 20px}
  .mono{font-family:var(--mono)}

  header{position:sticky;top:0;z-index:5;backdrop-filter:blur(10px);
    background:linear-gradient(to bottom,rgba(7,11,9,.92),rgba(7,11,9,.5));border-bottom:1px solid var(--line)}
  nav{display:flex;align-items:center;justify-content:space-between;height:58px}
  .logo{font-family:var(--mono);font-weight:700;letter-spacing:.5px;font-size:15px}
  .logo b{color:var(--a)} .logo i{color:var(--b);font-style:normal}
  .back{font-family:var(--mono);font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
  .back:hover{color:var(--a)}
  .navlinks{display:flex;gap:20px;font-family:var(--mono);font-size:13px;color:var(--muted)}
  .navlinks a:hover{color:var(--a)}
  @media(max-width:600px){.navlinks{display:none}}

  /* hero — tinted by the app's own theme */
  .hero{position:relative;padding:72px 0 30px;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:
    radial-gradient(640px 280px at 8% -10%,color-mix(in srgb,var(--a) 26%,transparent),transparent 62%),
    radial-gradient(560px 280px at 98% 0%,color-mix(in srgb,var(--b) 22%,transparent),transparent 60%)}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:3px;color:var(--a);opacity:.95}
  .htitle{font-size:clamp(36px,9vw,84px);line-height:.98;margin:12px 0 10px;font-weight:700;letter-spacing:-1.5px;
    background:linear-gradient(92deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;
    overflow-wrap:break-word;word-break:break-word}
  .lead{font-size:clamp(16px,2.6vw,20px);color:var(--ink);max-width:680px;margin:0 0 18px}
  .pfs{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 22px}
  .pf{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:700;
    letter-spacing:.3px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
  .pf i{width:7px;height:7px;border-radius:50%;display:inline-block}
  .cta{display:flex;gap:10px;flex-wrap:wrap}
  .btn{font-family:var(--mono);font-size:14px;font-weight:700;padding:13px 20px;border-radius:12px;
    border:1px solid var(--line);background:var(--panel);transition:.15s;display:inline-flex;align-items:center;gap:8px}
  .btn:hover{transform:translateY(-2px)}
  .btn.primary{background:linear-gradient(92deg,var(--a),var(--b));color:#05080c;border:none;
    box-shadow:0 0 30px color-mix(in srgb,var(--a) 35%,transparent)}
  .btn.ghost:hover{border-color:var(--a);color:var(--a)}

  section{padding:30px 0}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:2px;color:var(--b)}
  h2{font-size:clamp(22px,4.5vw,32px);margin:6px 0 14px;letter-spacing:-.5px}
  .panel{border:1px solid var(--line);border-radius:18px;padding:22px 24px;
    background:linear-gradient(180deg,var(--panel),var(--panel2));position:relative;overflow:hidden}
  .panel::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(520px 200px at 0% -20%,color-mix(in srgb,var(--a) 10%,transparent),transparent 60%)}
  .use{font-size:16px;color:var(--ink);margin:0;position:relative}
  .long{color:var(--muted);max-width:720px;margin:14px 0 0;position:relative}

  .feat{list-style:none;padding:0;margin:0;display:grid;gap:12px}
  .feat li{position:relative;padding-left:26px;color:var(--muted);font-size:15px}
  .feat li::before{content:"▸";position:absolute;left:6px;top:0;color:var(--a)}
  .feat li b{color:var(--ink);font-weight:600}

  .dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:4px}
  .dlc{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--panel);transition:.15s;
    display:flex;align-items:center;justify-content:space-between;gap:10px}
  .dlc:hover{border-color:var(--a);transform:translateY(-2px)}
  .dlc .t{font-family:var(--mono);font-size:14px;font-weight:700}
  .dlc .arr{color:var(--a);font-family:var(--mono)}
  .dlc.go{background:linear-gradient(92deg,color-mix(in srgb,var(--a) 22%,var(--panel)),color-mix(in srgb,var(--b) 18%,var(--panel)));border-color:transparent}
  .dlc.go .arr{color:var(--ink)}

  footer{border-top:1px solid var(--line);padding:28px 0 46px;color:var(--muted);font-family:var(--mono);font-size:13px;margin-top:20px}
  .foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
  .foot a:hover{color:var(--a)}
  .nf{padding:120px 0;text-align:center;color:var(--muted);font-family:var(--mono)}
  .nf a{color:var(--a)}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<header><div class="wrap"><nav>
  <a class="back" href="index.html#creations">◂ CAK3D_Creations</a>
  <div class="navlinks">
    <a href="index.html#creations">Builds</a>
    <a href="flash.html">Flash</a>
    <a href="https://github.com/real-CAK3D" target="_blank" rel="noopener">GitHub ↗</a>
  </div>
</nav></div></header>

<main class="wrap" id="main"><!-- rendered by JS --></main>

<footer><div class="wrap foot">
  <span>© 2026 CAK3D_Creations</span>
  <span><a href="index.html#creations">◂ Back to all builds</a></span>
</div></footer>

<script src="catalog.js"></script>
<script>
(function(){
  const {PF,PROJECTS}=window.CAK3D;
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const id=new URLSearchParams(location.search).get('id');
  const p=PROJECTS.find(x=>x.slug===id);
  const main=document.getElementById('main');

  if(!p){
    document.title='CAK3D_Creations — not found';
    main.innerHTML='<div class="nf">That build wasn’t found. <a href="index.html#creations">Back to all builds ▸</a></div>';
    startBg('#5fd36a','#f0b429','dots');
    return;
  }

  // Apply the app's own theme.
  const a=(p.th&&p.th.a)||'#5fd36a', b=(p.th&&p.th.b)||'#f0b429';
  document.documentElement.style.setProperty('--a',a);
  document.documentElement.style.setProperty('--b',b);
  document.title='CAK3D — '+p.name;
  document.querySelector('meta[name=theme-color]').setAttribute('content',a);

  const pill=k=>{const m=PF[k];return `<span class="pf" style="color:${m.c};border-color:${m.c}55"><i style="background:${m.c}"></i>${m.l}</span>`};
  const pfs=p.pf.map(pill).join('');
  const feats=(p.feats||[]).map(f=>`<li>${f}</li>`).join('');

  // The primary CTA is the build's "go" link (download / open); fall back to the first link.
  const primary=p.links.find(l=>l.go)||p.links[0];

  const dlCard=l=>{
    const repo=l.apk?l.u.replace('https://github.com/','').replace('/releases/latest',''):null;
    const apk=repo?` data-apk-latest="${repo}"`:'';
    return `<a class="dlc${l.go?' go':''}" href="${l.u}" target="_blank" rel="noopener"${apk}><span class="t">${esc(l.t)}</span><span class="arr">▸</span></a>`;
  };

  main.innerHTML=
    `<div class="hero">`+
      `<div class="kicker mono">// ${esc(p.k)}</div>`+
      `<h1 class="htitle">${esc(p.name)}</h1>`+
      `<p class="lead">${esc(p.desc)}</p>`+
      `<div class="pfs">${pfs}</div>`+
      `<div class="cta">`+
        (primary?`<a class="btn primary" href="${primary.u}"${primary.apk?` data-apk-latest="${primary.u.replace('https://github.com/','').replace('/releases/latest','')}"`:''} target="_blank" rel="noopener">▾ ${esc(primary.t)}</a>`:'')+
        `<a class="btn ghost" href="index.html#creations">◂ All builds</a>`+
      `</div>`+
    `</div>`+
    (p.use?`<section><div class="eyebrow mono">// WHAT IT'S FOR</div><div class="panel"><p class="use">${esc(p.use)}</p>${p.long?`<p class="long">${esc(p.long)}</p>`:''}</div></section>`:'')+
    (feats?`<section><div class="eyebrow mono">// WHAT'S INSIDE</div><h2>Features</h2><ul class="feat">${feats}</ul></section>`:'')+
    `<section><div class="eyebrow mono">// GET IT</div><h2>Download & links</h2><div class="dl">${p.links.map(dlCard).join('')}</div></section>`;

  startBg(a,b,p.motif||'dots');

  // Point APK buttons straight at the latest release's .apk asset (public repos only).
  (async()=>{
    for(const el of document.querySelectorAll('[data-apk-latest]')){
      const repo=el.getAttribute('data-apk-latest');
      try{
        const r=await fetch(`https://api.github.com/repos/${repo}/releases/latest`,{headers:{Accept:'application/vnd.github+json'}});
        if(!r.ok) continue;
        const j=await r.json();
        const apk=(j.assets||[]).find(x=>/\.apk$/i.test(x.name));
        if(apk&&apk.browser_download_url){ el.href=apk.browser_download_url; el.removeAttribute('target'); el.rel='nofollow'; }
      }catch{}
    }
  })();

  // Per-app animated background. Each build picks a `motif`; its two accent
  // colours (ca, cb) tint it. Unknown motifs fall back to a drifting particle field.
  function startBg(ca,cb,motif){
    const c=document.getElementById('bg'), x=c.getContext('2d');
    let W,H,dpr=1,t=0,S={};
    const R=()=>Math.random();
    const hx=(h,al)=>{h=String(h).replace('#','');if(h.length===3)h=h.replace(/./g,'$&$&');
      const n=parseInt(h,16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${al})`;};
    const wrap=p=>{if(p.px<0)p.px+=W;if(p.px>W)p.px-=W;if(p.py<0)p.py+=H;if(p.py>H)p.py-=H;};
    const dot=()=>({px:R()*W,py:R()*H,vx:(R()-.5)*.22*dpr,vy:(R()-.5)*.22*dpr,r:(R()*1.6+.6)*dpr,ph:R()*6.28});
    const MCPAL=[['#6cbf3f','#58a233','#3e7a24'],['#9a6b3f','#7d5531','#5e3f24'],['#9aa0a6','#7f858b','#636870']];

    const INIT={
      dots(){S.d=Array.from({length:Math.min(70,W*H/32000|0)},dot);},
      crow(){S.d=Array.from({length:36},dot);
        S.b=Array.from({length:9},()=>({x:R()*W,y:R()*H*.6+H*.06,sp:(.3+R()*.7)*dpr,sz:(7+R()*11)*dpr,ph:R()*6.28,dir:R()<.5?1:-1}));},
      forest(){S.st=Array.from({length:70},()=>({x:R()*W,y:R()*H*.5,ph:R()*6.28,r:(R()*1.1+.4)*dpr}));
        S.f=Array.from({length:42},dot);S.tr=[];let tx=-20*dpr;
        while(tx<W+30*dpr){const w=(26+R()*30)*dpr,h=(50+R()*95)*dpr;S.tr.push({x:tx,w,h,back:R()<.5});tx+=w*.6;}
        S.tr.sort((a,b)=>Number(b.back)-Number(a.back));},
      kitchen(){S.s=Array.from({length:22},()=>({x:R()*W,y:H*(.5+R()*.5),ph:R()*6.28,sp:(.3+R()*.5)*dpr,r:(18+R()*26)*dpr}));},
      tech(){S.n=Array.from({length:Math.min(46,W*H/42000|0)},dot);S.e=[];
        for(let i=0;i<S.n.length;i++)for(let j=i+1;j<S.n.length;j++){const a=S.n[i],b=S.n[j];
          if(Math.hypot(a.px-b.px,a.py-b.py)<150*dpr&&R()<.5)S.e.push({a:i,b:j,p:R(),sp:.004+R()*.01});}},
      tv(){S.roll=0;},
      space(){S.st=Array.from({length:90},()=>({x:R()*W,y:R()*H,ph:R()*6.28,r:(R()*1.1+.3)*dpr}));
        S.col=Array.from({length:Math.max(6,W/(16*dpr)|0)},(_,i)=>({x:i*16*dpr+8*dpr,y:R()*H,sp:(2+R()*4)*dpr,n:4+(R()*8|0)}));
        S.gh={ph:0};},
      clock(){S.p=Array.from({length:34},dot);},
      computer(){S.col=Array.from({length:Math.max(8,W/(18*dpr)|0)},(_,i)=>({x:i*18*dpr+6*dpr,y:R()*H,sp:(1.5+R()*3)*dpr,n:5+(R()*10|0)}));
        S.cur={x:R()*W,y:R()*H,bl:0};},
      news(){S.gap=16*dpr;},
      weed(){S.l=Array.from({length:24},()=>({x:R()*W,y:R()*H,sp:(.4+R()*.8)*dpr,sz:(9+R()*12)*dpr,rot:R()*6.28,vr:(R()-.5)*.03,sw:R()*6.28}));
        S.sm=Array.from({length:10},()=>({x:R()*W,y:H*(.6+R()*.5),r:(26+R()*40)*dpr,sp:(.2+R()*.4)*dpr,ph:R()*6.28}));},
      truck(){S.p=[];S.track=0;},
      mc(){S.c=Array.from({length:26},()=>({x:R()*W,y:R()*H,s:(16+R()*22)*dpr,sp:(.2+R()*.5)*dpr,k:R()*3|0}));},
      ghost(){S.g=Array.from({length:10},()=>({x:R()*W,y:R()*H,s:(16+R()*22)*dpr,sp:(.2+R()*.5)*dpr*(R()<.5?1:-1),ph:R()*6.28}));},
    };

    function pField(d,line){
      if(line)for(let i=0;i<d.length;i++)for(let j=i+1;j<d.length;j++){
        const a=d[i],b=d[j],dd=Math.hypot(a.px-b.px,a.py-b.py),lim=130*dpr;
        if(dd<lim){x.globalAlpha=(1-dd/lim)*.1;x.strokeStyle=ca;x.lineWidth=dpr;x.beginPath();x.moveTo(a.px,a.py);x.lineTo(b.px,b.py);x.stroke();}}
      x.globalAlpha=1;
      for(const p of d){p.px+=p.vx;p.py+=p.vy;wrap(p);const pu=(Math.sin(t*2+p.ph)*.5+.5);
        x.globalAlpha=.2+pu*.45;x.fillStyle=(p.ph>3?cb:ca);x.beginPath();x.arc(p.px,p.py,p.r+pu*1.2*dpr,0,7);x.fill();
        x.globalAlpha=.06;x.beginPath();x.arc(p.px,p.py,(p.r+pu*1.2*dpr)*3,0,7);x.fill();}
      x.globalAlpha=1;
    }
    function bird(bx,by,sz,flap,col){const lift=Math.sin(flap)*sz*.5;
      x.strokeStyle=col;x.lineWidth=Math.max(1,sz*.16);x.lineCap='round';x.beginPath();
      x.moveTo(bx-sz,by-lift);x.quadraticCurveTo(bx-sz*.3,by+sz*.15,bx,by);
      x.quadraticCurveTo(bx+sz*.3,by+sz*.15,bx+sz,by-lift);x.stroke();}
    function ghost(gx,gy,s,fill){x.fillStyle=fill;x.beginPath();x.arc(gx,gy-s*.1,s*.5,Math.PI,0);
      x.lineTo(gx+s*.5,gy+s*.5);const wv=4;for(let i=0;i<=wv;i++){const wx=gx+s*.5-(i/wv)*s,wy=gy+s*.5+((i%2===0)?-s*.14:0);x.lineTo(wx,wy);}
      x.closePath();x.fill();x.fillStyle=hx(ca,.5);x.beginPath();x.arc(gx-s*.18,gy-s*.1,s*.09,0,7);x.arc(gx+s*.18,gy-s*.1,s*.09,0,7);x.fill();}
    function leaf(lx,ly,s,rot,fill){x.save();x.translate(lx,ly);x.rotate(rot);x.fillStyle=fill;
      const bl=7;for(let i=0;i<bl;i++){const an=(-.5+i/(bl-1))*Math.PI,len=s*(.55+.45*Math.cos((i-3)/3));
        x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(Math.cos(an)*len*.4-Math.sin(an)*s*.12,Math.sin(an)*len*.4+Math.cos(an)*s*.12,Math.cos(an)*len,Math.sin(an)*len);
        x.quadraticCurveTo(Math.cos(an)*len*.4+Math.sin(an)*s*.12,Math.sin(an)*len*.4-Math.cos(an)*s*.12,0,0);x.fill();}x.restore();}
    function cube(qx,qy,s,k){const P=MCPAL[k%3],w=s*.5,hh=s*.28,d=s*.5;
      x.fillStyle=P[0];x.beginPath();x.moveTo(qx,qy-hh);x.lineTo(qx+w,qy);x.lineTo(qx,qy+hh);x.lineTo(qx-w,qy);x.closePath();x.fill();
      x.fillStyle=P[2];x.beginPath();x.moveTo(qx-w,qy);x.lineTo(qx,qy+hh);x.lineTo(qx,qy+hh+d);x.lineTo(qx-w,qy+d);x.closePath();x.fill();
      x.fillStyle=P[1];x.beginPath();x.moveTo(qx+w,qy);x.lineTo(qx,qy+hh);x.lineTo(qx,qy+hh+d);x.lineTo(qx+w,qy+d);x.closePath();x.fill();}

    const DRAW={
      dots(){pField(S.d,true);},
      crow(){pField(S.d,false);
        for(const b of S.b){b.x+=b.sp*b.dir;if(b.x>W+30*dpr)b.x=-30*dpr;if(b.x<-30*dpr)b.x=W+30*dpr;
          bird(b.x,b.y+Math.sin(t*1.5+b.ph)*4*dpr,b.sz,t*6+b.ph,(b.ph>3?hx(cb,.5):hx(ca,.55)));}},
      forest(){for(const s of S.st){const tw=.35+.65*(Math.sin(t*1.5+s.ph)*.5+.5);x.globalAlpha=tw*.7;x.fillStyle='#ffe7a3';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();}
        x.globalAlpha=1;
        for(const p of S.f){p.px+=p.vx;p.py+=p.vy;wrap(p);const pu=(Math.sin(t*2+p.ph)*.5+.5);x.globalAlpha=.25+pu*.5;x.fillStyle=(p.ph>3?cb:ca);x.beginPath();x.arc(p.px,p.py,p.r+pu*1.2*dpr,0,7);x.fill();x.globalAlpha=.06;x.beginPath();x.arc(p.px,p.py,(p.r+pu*1.2*dpr)*3,0,7);x.fill();}
        x.globalAlpha=1;
        for(const tr of S.tr){x.fillStyle=tr.back?'#0c160c':'#07120a';x.beginPath();x.moveTo(tr.x,H);x.lineTo(tr.x+tr.w/2,H-tr.h);x.lineTo(tr.x+tr.w,H);x.closePath();x.fill();}},
      kitchen(){const g=x.createRadialGradient(W*.5,H,0,W*.5,H,H*.8);g.addColorStop(0,hx(ca,.10));g.addColorStop(1,hx(ca,0));x.fillStyle=g;x.fillRect(0,0,W,H);
        x.strokeStyle=hx(cb,.06);x.lineWidth=dpr;for(let gy=H*.6;gy<H;gy+=28*dpr){x.beginPath();x.moveTo(0,gy);x.lineTo(W,gy);x.stroke();}
        for(let gx=0;gx<W;gx+=28*dpr){x.beginPath();x.moveTo(gx,H*.6);x.lineTo(gx,H);x.stroke();}
        for(const s of S.s){s.y-=s.sp;if(s.y<-s.r){s.y=H+s.r;s.x=R()*W;}x.globalAlpha=Math.max(0,(s.y/H)-.2)*.12;x.fillStyle=hx(cb,1);x.beginPath();x.arc(s.x+Math.sin(t+s.ph)*10*dpr,s.y,s.r,0,7);x.fill();}
        x.globalAlpha=1;},
      tech(){for(const e of S.e){const a=S.n[e.a],b=S.n[e.b];x.globalAlpha=.1;x.strokeStyle=ca;x.lineWidth=dpr;x.beginPath();x.moveTo(a.px,a.py);x.lineTo(b.px,b.py);x.stroke();
          e.p+=e.sp;if(e.p>1)e.p-=1;x.globalAlpha=.9;x.fillStyle=cb;x.beginPath();x.arc(a.px+(b.px-a.px)*e.p,a.py+(b.py-a.py)*e.p,1.6*dpr,0,7);x.fill();}
        x.globalAlpha=1;
        for(const n of S.n){n.px+=n.vx*.3;n.py+=n.vy*.3;wrap(n);x.globalAlpha=.7;x.fillStyle=ca;x.beginPath();x.arc(n.px,n.py,1.8*dpr,0,7);x.fill();}
        x.globalAlpha=1;},
      tv(){const g=x.createRadialGradient(W*.5,H*.5,0,W*.5,H*.5,W*.6);g.addColorStop(0,hx(ca,.08));g.addColorStop(1,hx(cb,.04));x.fillStyle=g;x.fillRect(0,0,W,H);

      space(){for(const s of S.st){const tw=.3+.7*(Math.sin(t*1.5+s.ph)*.5+.5);x.globalAlpha=tw*.7;x.fillStyle='#cfe8ff';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();}

      clock(){const cx=W*.5,cy=H*.5,rad=Math.min(W,H)*.3;

        x.globalAlpha=.5;x.strokeStyle=cb;x.lineWidth=2*dpr;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(t-1.57)*rad*.85,cy+Math.sin(t-1.57)*rad*.85);x.stroke();
        x.globalAlpha=.35;x.strokeStyle=ca;x.lineWidth=3*dpr;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(t/12-1.57)*rad*.5,cy+Math.sin(t/12-1.57)*rad*.5);x.stroke();x.globalAlpha=1;
        for(const p of S.p){p.px+=p.vx;p.py+=p.vy;wrap(p);const pu=(Math.sin(t*2+p.ph)*.5+.5);x.globalAlpha=.18+pu*.4;x.fillStyle=(p.ph>3?cb:ca);x.beginPath();x.arc(p.px,p.py,p.r+pu*dpr,0,7);x.fill();}x.globalAlpha=1;},
      computer(){x.globalAlpha=.05;x.strokeStyle=ca;x.lineWidth=dpr;for(let gx=0;gx<W;gx+=30*dpr){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,H);x.stroke();}for(let gy=0;gy<H;gy+=30*dpr){x.beginPath();x.moveTo(0,gy);x.lineTo(W,gy);x.stroke();}

      weed(){for(const s of S.sm){s.y-=s.sp;if(s.y<-s.r){s.y=H+s.r;s.x=R()*W;}x.globalAlpha=.05;x.fillStyle=hx(ca,1);x.beginPath();x.arc(s.x+Math.sin(t*.6+s.ph)*14*dpr,s.y,s.r,0,7);x.fill();}
